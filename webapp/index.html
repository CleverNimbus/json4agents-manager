<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSON Manager</title>
    <link rel="stylesheet" href="/styles.css" />
    <!--
      No build step: the bare specifier "vue" resolves to the browser build that
      the server exposes from node_modules. Change it to re-pin the version.
    -->
    <script type="importmap">
      { "imports": { "vue": "/vendor/vue.esm-browser.prod.js" } }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>JSON Manager needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
